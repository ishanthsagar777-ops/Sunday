<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunday // Autonomous Personal AI (FRIDAY Protocol)</title>
    <style>
        :root {
            --bg-color: #030712;
            --panel-bg: #0f172a;
            --border-color: #1e293b;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --user-bubble: #0284c7;
            --system-bubble: #1e293b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 12px 20px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1rem;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .status-badge {
            font-size: 0.75rem;
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Vision / Camera Section */
        .vision-section {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
            gap: 10px;
        }

        .vision-container {
            position: relative;
            width: 100%;
            height: 200px;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .vision-overlay {
            position: absolute;
            top: 5px;
            left: 5px;
            font-size: 0.65rem;
            color: var(--accent-color);
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 3px;
        }

        /* Chat Core */
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .message {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.4;
            font-size: 0.9rem;
            word-wrap: break-word;
        }

        .user {
            background-color: var(--user-bubble);
            color: white;
            align-self: flex-end;
        }

        .system {
            background-color: var(--system-bubble);
            color: var(--text-main);
            align-self: flex-start;
            border: 1px solid var(--border-color);
        }

        /* Controls */
        #input-container {
            padding: 15px;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 6px var(--accent-glow);
        }

        button {
            padding: 10px 16px;
            border-radius: 6px;
            border: none;
            background-color: var(--accent-color);
            color: var(--bg-color);
            font-weight: bold;
            cursor: pointer;
        }

        #mic-btn.listening {
            background-color: #ef4444;
            color: white;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        @media (max-width: 768px) {
            .vision-section { display: none; } /* Stacks cleanly on smaller screens */
        }
    </style>
</head>
<body>

    <header>
        <h1>SUNDAY // AI OS</h1>
        <div class="status-badge" id="sys-status">● ONLINE</div>
    </header>

    <div class="workspace">
        <!-- Environment Vision Feed -->
        <div class="vision-section">
            <span style="font-size:0.8rem; color:var(--accent-color); font-weight:bold;">OPTICAL FEED</span>
            <div class="vision-container">
                <video id="cam-feed" autoplay playsinline muted></video>
                <div class="vision-overlay">LIVE STREAM ACTIVE</div>
            </div>
            <button onclick="analyzeEnvironment()" style="font-size:0.8rem; background:#1e293b; color:var(--accent-color); border:1px solid var(--border-color);">Scan Environment</button>
        </div>

        <!-- Chat Core -->
        <div class="chat-section">
            <div id="chat-container">
                <div class="message system">Sunday online, Ishanth. Audio synthesis and environment tracking initialized. How can I assist you?</div>
            </div>

            <div id="input-container">
                <input type="text" id="user-input" placeholder="Speak or type to Sunday..." autofocus>
                <button id="mic-btn" onclick="toggleSpeechRecognition()" title="Voice Input">🎤</button>
                <button onclick="handleCommand()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sysStatus = document.getElementById('sys-status');
        const micBtn = document.getElementById('mic-btn');
        const camFeed = document.getElementById('cam-feed');

        let recognition = null;
        let isListening = false;

        // Initialize Camera Feed
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => { camFeed.srcObject = stream; })
            .catch(err => { console.log("Camera access restricted or unavailable:", err); });

        // Initialize Speech Recognition (STT)
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = function(event) {
                const speechText = event.results[0][0].transcript;
                userInput.value = speechText;
                stopListening();
                handleCommand();
            };
            recognition.onerror = () => stopListening();
            recognition.onend = () => stopListening();
        }

        function toggleSpeechRecognition() {
            if (!recognition) {
                alert("Speech recognition is not supported on this browser.");
                return;
            }
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
                isListening = true;
                micBtn.classList.add('listening');
                micBtn.textContent = '🛑';
            }
        }

        function stopListening() {
            isListening = false;
            micBtn.classList.remove('listening');
            micBtn.textContent = '🎤';
        }

        // Speech Synthesis (TTS) - Sunday speaks out loud
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop any ongoing speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleCommand();
        });

        function handleCommand() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';
            sysStatus.textContent = '● PROCESSING...';

            setTimeout(() => {
                const lower = text.toLowerCase();
                let reply = `Command received, Ishanth. Executing local routine for: "${text}".`;

                if (lower.includes('hello') || lower.includes('hi')) {
                    reply = "Hello Ishanth. All systems are operating at peak efficiency.";
                } else if (lower.includes('status') || lower.includes('diagnostics')) {
                    reply = "Optical telemetry stable, speech synthesis online, core security protocols fully active.";
                } else if (lower.includes('who are you')) {
                    reply = "I am Sunday, your independent personal AI operating system.";
                }

                appendMessage(reply, 'system');
                sysStatus.textContent = '● ONLINE';
                
                // Speak response out loud like FRIDAY
                speak(reply);
            }, 400);
        }

        function analyzeEnvironment() {
            sysStatus.textContent = '● SCANNING...';
            setTimeout(() => {
                const scanReply = "Environment scan complete. Optical feeds are clear, local parameters optimal.";
                appendMessage(scanReply, 'system');
                sysStatus.textContent = '● ONLINE';
                speak(scanReply);
            }, 600);
        }

        function appendMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
